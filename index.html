<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>鹿島アントラーズ スタメン予想メーカー</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Noto+Sans+JP:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'Noto Sans JP', 'Inter', sans-serif;
    background-color: #0b1120;
    color: #f8fafc;
    -webkit-tap-highlight-color: transparent;
  }
  .font-num {
    font-family: 'Inter', 'Noto Sans JP', sans-serif;
    font-variant-numeric: tabular-nums;
  }
  .antlers-header {
    background: linear-gradient(90deg, #991b1b 0%, #7f1d1d 55%, #450a0a 100%);
  }
  .soccer-pitch {
    background: repeating-linear-gradient(
      to bottom,
      #1b6332 0px,
      #1b6332 44px,
      #207039 44px,
      #207039 88px
    );
    box-shadow: inset 0 0 36px rgba(0, 0, 0, 0.35);
  }
  .pitch-line {
    border-color: rgba(255, 255, 255, 0.72);
  }
  .antlers-red {
    background: linear-gradient(135deg, #b91c1c 0%, #7f1d1d 100%);
  }
  .slot-btn {
    -webkit-touch-callout: none;
    user-select: none;
  }
</style>
</head>
<body class="min-h-screen pb-16">

  <!-- ヘッダー -->
  <header class="antlers-header border-b border-amber-400/30 sticky top-0 z-30">
    <div class="max-w-5xl mx-auto px-3.5 py-2.5 flex items-center justify-between gap-2">
      <div class="min-w-0">
        <h1 class="text-sm sm:text-lg font-black tracking-tight text-white truncate">スタメン予想メーカー</h1>
        <p class="text-[10px] text-amber-200/85 truncate">鹿島アントラーズ · Created by @syou0120</p>
      </div>
      <div class="flex items-center gap-1.5 shrink-0">
        <button type="button" onclick="openPlayerPickerForSelected()"
          class="px-2.5 py-1.5 rounded-lg text-[11px] font-black bg-amber-400 hover:bg-amber-300 text-slate-950 shadow transition">
          選手一覧
        </button>
        <button type="button" onclick="resetToDefault()"
          class="px-2.5 py-1.5 rounded-lg text-[11px] font-bold bg-slate-950/75 hover:bg-slate-900 text-slate-100 border border-white/20 transition">
          リセット
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-3.5 pt-3.5 space-y-3.5">

    <!-- 布陣バー -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl px-3 py-2.5 flex items-center justify-between gap-2 overflow-x-auto">
      <div class="flex items-center gap-1.5 shrink-0">
        <span class="text-xs font-bold text-slate-400 mr-0.5">布陣:</span>
        <button type="button" data-form="4-4-2" onclick="changeFormation('4-4-2')" class="form-btn px-2.5 py-1 rounded-lg text-xs font-black border transition">4-4-2</button>
        <button type="button" data-form="4-2-3-1" onclick="changeFormation('4-2-3-1')" class="form-btn px-2.5 py-1 rounded-lg text-xs font-black border transition">4-2-3-1</button>
        <button type="button" data-form="4-3-3" onclick="changeFormation('4-3-3')" class="form-btn px-2.5 py-1 rounded-lg text-xs font-black border transition">4-3-3</button>
        <button type="button" data-form="3-4-2-1" onclick="changeFormation('3-4-2-1')" class="form-btn px-2.5 py-1 rounded-lg text-xs font-black border transition">3-4-2-1</button>
      </div>
      <span id="selected-target-badge" title="現在選択中の枠" class="text-[11px] font-bold px-2.5 py-1 rounded-full bg-amber-500/15 text-amber-300 border border-amber-400/30 whitespace-nowrap">
        選択中: 先発 1 (GK)
      </span>
    </div>

    <!-- 対戦相手バー（布陣のすぐ下） -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3 space-y-2">
      <div class="flex items-center justify-between gap-2">
        <label for="opponent-input" class="text-xs font-black text-white flex items-center gap-1.5 shrink-0">
          <span class="w-1.5 h-3.5 bg-amber-400 rounded-full"></span>
          <span>対戦相手</span>
        </label>
        <span class="text-[10px] text-slate-400">J1から選ぶか自由入力</span>
      </div>

      <div class="flex flex-col sm:flex-row gap-2">
        <input id="opponent-input" type="text" placeholder="例: 浦和レッズ / ACLE対戦相手未定 / 任意クラブ名"
          oninput="updateOpponent()"
          class="flex-1 min-w-0 px-3 py-2 rounded-xl bg-slate-950 border border-slate-700 text-xs sm:text-sm font-bold text-white placeholder:text-slate-500 focus:outline-none focus:border-amber-400">
        <button type="button" onclick="setOpponent('')"
          class="px-3 py-2 rounded-xl text-xs font-bold bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 shrink-0 transition">
          クリア
        </button>
      </div>

      <!-- クイックボタン（J1・ACLE対戦相手未定・対戦相手未定） -->
      <div class="flex items-center gap-1.5 flex-wrap">
        <button type="button" onclick="toggleJ1List()" id="j1-toggle-btn"
          class="px-3 py-1 rounded-lg text-xs font-black border transition bg-red-700 hover:bg-red-600 text-white border-amber-400/70">
          J1 <span id="j1-arrow" class="text-[10px] ml-0.5">▼</span>
        </button>
        <button type="button" onclick="setOpponent('ACLE対戦相手未定')"
          class="opp-preset-btn px-2.5 py-1 rounded-lg text-xs font-bold border transition bg-slate-950 hover:border-slate-500 text-slate-200 border-slate-800">
          ACLE対戦相手未定
        </button>
        <button type="button" onclick="setOpponent('対戦相手未定')"
          class="opp-preset-btn px-2.5 py-1 rounded-lg text-xs font-bold border transition bg-slate-950 hover:border-slate-500 text-slate-200 border-slate-800">
          対戦相手未定
        </button>
      </div>

      <!-- J1 縦展開リスト（初期状態は非表示） -->
      <div id="j1-club-list" class="hidden pt-2 border-t border-slate-800/90 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-1.5"></div>
    </div>

    <!-- 試合タイトル＆メモカード -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3.5 space-y-2.5">
      <div class="flex items-start justify-between gap-2">
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2 flex-wrap">
            <input id="match-title" type="text" value="明治安田J1リーグ 予想スタメン" oninput="updateMeta()"
              aria-label="見出し・試合タイトル"
              class="min-w-0 flex-1 bg-transparent text-sm sm:text-base font-black text-white focus:outline-none border-b border-transparent focus:border-amber-400 pb-0.5">
            <span id="opponent-display-badge" class="hidden px-2 py-0.5 rounded-md bg-amber-500/20 border border-amber-400/50 text-[11px] font-black text-amber-300 shrink-0"></span>
          </div>
          <div class="flex items-center gap-2 mt-1.5">
            <span id="current-form-badge" class="px-2 py-0.5 rounded bg-red-800 border border-amber-400/60 text-[10px] font-black text-white">4-4-2</span>
            <input id="match-memo" type="text" value="勝利あるのみ！#antlers" oninput="updateMeta()"
              aria-label="ひとことメモ"
              class="flex-1 min-w-0 bg-transparent text-xs font-bold text-amber-200 focus:outline-none border-b border-transparent focus:border-amber-400">
          </div>
        </div>
        <div class="text-right shrink-0">
          <div class="text-[9px] font-bold tracking-wider text-slate-400">STARTING XI</div>
          <div id="xi-count" class="text-sm font-black font-num text-amber-400">11 / 11</div>
        </div>
      </div>
      <div class="flex items-center justify-between text-[11px] text-slate-400 pt-1 border-t border-slate-800/80">
        <span>枠をタップすると選手一覧が開きます</span>
        <button type="button" onclick="openPlayerPickerForSelected()" class="text-amber-300 font-bold underline shrink-0 ml-2">一覧から選ぶ</button>
      </div>
    </div>

    <!-- サッカーピッチ -->
    <div class="soccer-pitch relative w-full min-h-[430px] sm:min-h-[520px] aspect-[4/4.7] rounded-2xl border-2 border-white/75 overflow-hidden select-none">
      <div class="absolute inset-3 border-2 pitch-line pointer-events-none">
        <div class="absolute top-1/2 left-0 right-0 h-0.5 bg-white/70 -translate-y-1/2"></div>
        <div class="absolute top-1/2 left-1/2 w-24 h-24 sm:w-28 sm:h-28 rounded-full border-2 pitch-line -translate-x-1/2 -translate-y-1/2"></div>
        <div class="absolute top-1/2 left-1/2 w-2 h-2 rounded-full bg-white/80 -translate-x-1/2 -translate-y-1/2"></div>
        <div class="absolute top-0 left-1/2 w-[54%] h-[15.5%] border-b-2 border-x-2 pitch-line -translate-x-1/2">
          <div class="absolute top-0 left-1/2 w-[52%] h-[38%] border-b-2 border-x-2 pitch-line -translate-x-1/2"></div>
        </div>
        <div class="absolute bottom-0 left-1/2 w-[54%] h-[15.5%] border-t-2 border-x-2 pitch-line -translate-x-1/2">
          <div class="absolute bottom-0 left-1/2 w-[52%] h-[38%] border-t-2 border-x-2 pitch-line -translate-x-1/2"></div>
        </div>
      </div>
      <div id="pitch-slots" class="relative w-full h-full min-h-[430px] sm:min-h-[520px] z-10"></div>
    </div>

    <!-- ベンチメンバー -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3.5 space-y-2.5">
      <div class="flex items-center justify-between gap-2 flex-wrap">
        <div class="flex items-center gap-2">
          <span class="w-1.5 h-4 bg-red-600 rounded-full"></span>
          <h2 class="text-xs sm:text-sm font-black text-white">ベンチメンバー (SUBS)</h2>
        </div>
        <div class="flex items-center gap-1">
          <span class="text-[10px] text-slate-400 mr-0.5">枠数:</span>
          <button type="button" data-bench-size="9" onclick="changeBenchSize(9)" class="bench-size-btn px-2 py-0.5 rounded-md text-[11px] font-black border transition">9人(J/杯)</button>
          <button type="button" data-bench-size="12" onclick="changeBenchSize(12)" class="bench-size-btn px-2 py-0.5 rounded-md text-[11px] font-black border transition">12人(ACLE)</button>
        </div>
      </div>
      <div id="bench-slots" class="grid grid-cols-3 gap-2"></div>
    </div>

    <!-- 直近の予想履歴（最大3件） -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3.5 space-y-2.5">
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-2">
          <span class="w-1.5 h-4 bg-amber-400 rounded-full"></span>
          <h2 class="text-xs sm:text-sm font-black text-white">予想履歴（最大3件）</h2>
        </div>
        <button type="button" onclick="saveSnapshotToHistory()"
          class="px-3 py-1 rounded-lg text-[11px] font-black bg-amber-500 hover:bg-amber-400 text-slate-950 transition">
          今の予想を保存
        </button>
      </div>
      <div id="history-list" class="space-y-1.5"></div>
    </div>

    <!-- 負傷離脱中リスト -->
    <div id="injured-section" class="hidden bg-red-950/40 border border-rose-500/40 rounded-2xl p-3.5">
      <h3 class="text-xs font-black text-rose-300 mb-2">負傷離脱中 (INJURED) — 先発・ベンチから除外</h3>
      <div id="injured-list" class="flex flex-wrap gap-1.5"></div>
    </div>

    <!-- 共有・出力ボタン群 -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3.5 space-y-2">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
        <button type="button" onclick="generateShareImage()" class="w-full py-3 px-4 rounded-xl font-black text-xs sm:text-sm bg-amber-500 hover:bg-amber-400 text-slate-950 shadow transition">
          SNS共有用の画像を作成・保存
        </button>
        <button type="button" onclick="shareNative()" class="w-full py-3 px-4 rounded-xl font-black text-xs sm:text-sm bg-emerald-600 hover:bg-emerald-500 text-white shadow transition">
          画像・テキストを共有
        </button>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <button type="button" onclick="shareToX()" class="w-full py-2.5 px-3 rounded-xl font-black text-xs bg-slate-950 hover:bg-slate-800 text-white border border-slate-700 transition">
          Xでポスト（11人）
        </button>
        <button type="button" onclick="copyLineupText()" class="w-full py-2.5 px-3 rounded-xl font-black text-xs bg-slate-800 hover:bg-slate-700 text-slate-100 border border-slate-700 transition">
          テキストをコピー
        </button>
      </div>
    </div>

  </main>

  <!-- フッター -->
  <footer class="max-w-5xl mx-auto px-4 mt-8 pt-4 border-t border-slate-800/80 text-center space-y-1.5 text-[11px] text-slate-400">
    <div>
      <a href="https://www.youtube.com/@syou0120" target="_blank" rel="noopener noreferrer"
        class="inline-flex items-center gap-1.5 text-amber-300 hover:text-amber-200 underline underline-offset-2 font-bold transition">
        <span>Youtubeの鹿syouチャンネル</span>
      </a>
    </div>
    <div class="text-slate-500">
      鹿島アントラーズ スタメン予想メーカー — Created by @syou0120
    </div>
  </footer>

  <!-- 選手選択＆けが人切替モーダル -->
  <div id="player-picker-modal" class="fixed inset-0 z-50 hidden items-end sm:items-center justify-center bg-black/80 p-0 sm:p-4">
    <div class="bg-slate-900 border-t sm:border border-slate-700 rounded-t-3xl sm:rounded-2xl w-full max-w-lg p-4 space-y-3 max-h-[85vh] flex flex-col">
      <div class="flex items-center justify-between gap-2 shrink-0">
        <div>
          <h3 id="picker-modal-title" class="text-sm font-black text-white">選手を選択</h3>
          <p id="picker-modal-sub" class="text-[11px] text-amber-300 font-bold">対象枠: 先発 1 (GK)</p>
        </div>
        <button type="button" onclick="closePlayerPicker()" class="text-slate-400 hover:text-white text-lg font-bold px-2.5 py-1">✕</button>
      </div>

      <div class="flex items-center gap-1.5 flex-wrap shrink-0">
        <button type="button" onclick="setPosFilter('ALL')" data-pos="ALL" class="pos-filter-btn px-2.5 py-1 rounded-lg text-xs font-bold border transition">ALL</button>
        <button type="button" onclick="setPosFilter('GK')" data-pos="GK" class="pos-filter-btn px-2.5 py-1 rounded-lg text-xs font-bold border transition">GK</button>
        <button type="button" onclick="setPosFilter('DF')" data-pos="DF" class="pos-filter-btn px-2.5 py-1 rounded-lg text-xs font-bold border transition">DF</button>
        <button type="button" onclick="setPosFilter('MF')" data-pos="MF" class="pos-filter-btn px-2.5 py-1 rounded-lg text-xs font-bold border transition">MF</button>
        <button type="button" onclick="setPosFilter('FW')" data-pos="FW" class="pos-filter-btn px-2.5 py-1 rounded-lg text-xs font-bold border transition">FW</button>
      </div>

      <input id="player-search" type="text" placeholder="背番号や選手名で検索..." oninput="renderRoster()"
        class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-700 text-xs text-white focus:outline-none focus:border-amber-400 shrink-0">

      <div id="roster-list" class="overflow-y-auto space-y-1.5 pr-1 flex-1"></div>

      <div class="pt-2 border-t border-slate-800 flex justify-between items-center shrink-0">
        <button type="button" onclick="clearSelectedSlot()" class="px-3 py-2 rounded-xl text-xs font-bold bg-slate-800 hover:bg-slate-700 text-rose-300 border border-slate-700 transition">
          この枠を空にする
        </button>
        <button type="button" onclick="closePlayerPicker()" class="px-4 py-2 rounded-xl text-xs font-black bg-amber-500 hover:bg-amber-400 text-slate-950 transition">
          完了
        </button>
      </div>
    </div>
  </div>

  <!-- 画像プレビューモーダル -->
  <div id="share-image-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/80 p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-md w-full p-4 space-y-4 max-h-[92vh] overflow-y-auto">
      <div class="flex items-center justify-between">
        <h3 class="text-sm font-black text-white">SNS共有用画像プレビュー</h3>
        <button type="button" onclick="closeShareModal()" class="text-slate-400 hover:text-white text-lg font-bold px-2">✕</button>
      </div>
      <div class="rounded-xl overflow-hidden border border-slate-800 bg-slate-950">
        <img id="generated-image-preview" src="" alt="生成されたスタメン画像" class="w-full h-auto block">
      </div>
      <div class="flex flex-col sm:flex-row gap-2">
        <a id="download-image-link" download="kashima_lineup.png"
          class="flex-1 py-2.5 px-4 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs text-center transition">
          PNG画像を保存する
        </a>
        <button type="button" onclick="closeShareModal()" class="py-2.5 px-4 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-xs transition">
          閉じる
        </button>
      </div>
    </div>
  </div>

  <!-- トースト通知 -->
  <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 hidden px-4 py-2 rounded-full bg-slate-800 text-white text-xs font-bold border border-amber-400/50 shadow-xl whitespace-nowrap"></div>

const DEFAULT_BENCH_IDS = [21, 2, 25, 10, 14, 18, 11, 77, 19, null, null, null];

let state = {
  matchTitle: '明治安田J1リーグ 予想スタメン',
  opponent: '',
  matchMemo: '勝利あるのみ！#antlers',
  formation: '4-4-2',
  benchSize: DEFAULT_BENCH_SIZE,
  startingXI: [...DEFAULT_XI_IDS],
  bench: [...DEFAULT_BENCH_IDS],
  players: JSON.parse(JSON.stringify(INITIAL_PLAYERS)),
  selectedSlot: { type: 'xi', index: 0 },
  posFilter: 'ALL',
  j1Open: false,
  history: []
};

function normalizeBenchArray(arr, size = state.benchSize) {
  const maxLen = Math.max(12, size || DEFAULT_BENCH_SIZE);
  const copy = Array.isArray(arr) ? arr.slice(0, maxLen) : [];
  while (copy.length < maxLen) copy.push(null);
  return copy;
}

function getShortName(playerOrName) {
  if (!playerOrName) return '';
  if (typeof playerOrName === 'string') return playerOrName;
  return playerOrName.shortName || playerOrName.name || '';
}

function getSlotLabel(slot) {
  if (!slot) return '';
  if (slot.type === 'xi') {
    const role = (FORMATIONS[state.formation] || FORMATIONS['4-4-2'])[slot.index]?.role || '';
    return `先発 ${slot.index + 1} (${role})`;
  }
  return `ベンチ ${slot.index + 1}`;
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      matchTitle: state.matchTitle,
      opponent: state.opponent,
      matchMemo: state.matchMemo,
      formation: state.formation,
      benchSize: state.benchSize,
      startingXI: state.startingXI,
      bench: state.bench,
      players: state.players
    }));
  } catch (e) {}
}

function saveHistoryStorage() {
  try {
    localStorage.setItem(HISTORY_KEY, JSON.stringify(state.history.slice(0, MAX_HISTORY)));
  } catch (e) {}
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed.matchTitle !== undefined) state.matchTitle = parsed.matchTitle;
      if (parsed.opponent !== undefined) state.opponent = parsed.opponent;
      if (parsed.matchMemo !== undefined) state.matchMemo = parsed.matchMemo;
      if (parsed.formation && FORMATIONS[parsed.formation]) state.formation = parsed.formation;
      if (parsed.benchSize === 9 || parsed.benchSize === 12) state.benchSize = parsed.benchSize;
      if (Array.isArray(parsed.startingXI) && parsed.startingXI.length === 11) state.startingXI = parsed.startingXI;
      if (Array.isArray(parsed.bench)) state.bench = normalizeBenchArray(parsed.bench, state.benchSize);
      if (Array.isArray(parsed.players) && parsed.players.length > 0) {
        const validIds = new Set(INITIAL_PLAYERS.map(p => p.id));
        const injuredIds = new Set(parsed.players.filter(p => p.injured).map(p => p.id));
        state.players = JSON.parse(JSON.stringify(INITIAL_PLAYERS)).map(p => ({
          ...p,
          injured: injuredIds.has(p.id)
        }));
        state.startingXI = state.startingXI.map(id => (id && validIds.has(id) ? id : null));
        state.bench = normalizeBenchArray(state.bench.map(id => (id && validIds.has(id) ? id : null)), state.benchSize);
      }
    }
    const hRaw = localStorage.getItem(HISTORY_KEY);
    if (hRaw) {
      const hParsed = JSON.parse(hRaw);
      if (Array.isArray(hParsed)) state.history = hParsed.slice(0, MAX_HISTORY);
    }
  } catch (e) {}
}

function syncInputsFromState() {
  const titleEl = document.getElementById('match-title');
  const oppEl = document.getElementById('opponent-input');
  const memoEl = document.getElementById('match-memo');
  if (titleEl) titleEl.value = state.matchTitle;
  if (oppEl) oppEl.value = state.opponent;
  if (memoEl) memoEl.value = state.matchMemo;
}

function resetToDefault() {
  state.matchTitle = '明治安田J1リーグ 予想スタメン';
  state.opponent = '';
  state.matchMemo = '勝利あるのみ！#antlers';
  state.formation = '4-4-2';
  state.benchSize = DEFAULT_BENCH_SIZE;
  state.startingXI = [...DEFAULT_XI_IDS];
  state.bench = normalizeBenchArray(DEFAULT_BENCH_IDS, DEFAULT_BENCH_SIZE);
  state.players = JSON.parse(JSON.stringify(INITIAL_PLAYERS));
  state.selectedSlot = { type: 'xi', index: 0 };
  state.j1Open = false;
  syncInputsFromState();
  saveState();
  renderAll();
  showToast('初期スタメンに戻しました');
}

function updateMeta() {
  state.matchTitle = document.getElementById('match-title')?.value || '';
  state.matchMemo = document.getElementById('match-memo')?.value || '';
  saveState();
}

function updateOpponent() {
  state.opponent = document.getElementById('opponent-input')?.value || '';
  saveState();
  renderOpponentUI();
}

function setOpponent(name, closeJ1 = false) {
  state.opponent = name;
  if (closeJ1) state.j1Open = false;
  const oppEl = document.getElementById('opponent-input');
  if (oppEl) oppEl.value = name;
  saveState();
  renderOpponentUI();
}

function toggleJ1List() {
  state.j1Open = !state.j1Open;
  renderOpponentUI();
}

function changeFormation(form) {
  state.formation = form;
  saveState();
  renderAll();
}

function changeBenchSize(size) {
  if (size !== 9 && size !== 12) return;
  state.benchSize = size;
  state.bench = normalizeBenchArray(state.bench, size);
  if (state.selectedSlot.type === 'bench' && state.selectedSlot.index >= size) {
    state.selectedSlot = { type: 'bench', index: size - 1 };
  }
  saveState();
  renderAll();
  showToast(`ベンチ枠を ${size} 人に変更しました`);
}

function setPosFilter(pos) {
  state.posFilter = pos;
  renderPosFilterButtons();
  renderRoster();
}

function onSlotClick(type, index) {
  state.selectedSlot = { type, index };
  renderSelectedTargetBadge();
  renderPitch();
  renderBench();
  openPlayerPickerForSlot({ type, index });
}

function openPlayerPickerForSlot(slot) {
  state.selectedSlot = slot || { type: 'xi', index: 0 };
  const label = getSlotLabel(state.selectedSlot);
  document.getElementById('picker-modal-title').textContent = '選手を選択';
  document.getElementById('picker-modal-sub').textContent = `対象枠: ${label}`;
  renderPosFilterButtons();
  renderRoster();

  const modal = document.getElementById('player-picker-modal');
  modal.classList.remove('hidden');
  modal.classList.add('flex');
}

function openPlayerPickerForSelected() {
  openPlayerPickerForSlot(state.selectedSlot || { type: 'xi', index: 0 });
}

function closePlayerPicker() {
  const modal = document.getElementById('player-picker-modal');
  modal.classList.add('hidden');
  modal.classList.remove('flex');
}

function clearSelectedSlot() {
  const { type, index } = state.selectedSlot;
  if (type === 'xi') state.startingXI[index] = null;
  else state.bench[index] = null;
  saveState();
  renderAll();
  closePlayerPicker();
  showToast('枠を空にしました');
}

function assignPlayerToSelectedSlot(playerId) {
  const player = state.players.find(p => p.id === playerId);
  if (!player) return;
  if (player.injured) {
    showToast(`${getShortName(player)} は負傷離脱中のため選択できません`);
    return;
  }

  const { type, index } = state.selectedSlot;
  const xiIdx = state.startingXI.indexOf(playerId);
  const benchIdx = state.bench.slice(0, state.benchSize).indexOf(playerId);

  if (type === 'xi') {
    const prevId = state.startingXI[index];
    if (xiIdx !== -1 && xiIdx !== index) state.startingXI[xiIdx] = prevId || null;
    else if (benchIdx !== -1) state.bench[benchIdx] = prevId || null;
    state.startingXI[index] = playerId;
  } else {
    const prevId = state.bench[index];
    if (benchIdx !== -1 && benchIdx !== index) state.bench[benchIdx] = prevId || null;
    else if (xiIdx !== -1) state.startingXI[xiIdx] = prevId || null;
    state.bench[index] = playerId;
  }

  saveState();
  renderAll();
  closePlayerPicker();
  showToast(`#${player.number} ${getShortName(player)} を配置しました`);
}

function toggleInjured(playerId) {
  const player = state.players.find(p => p.id === playerId);
  if (!player) return;
  player.injured = !player.injured;

  if (player.injured) {
    state.startingXI = state.startingXI.map(id => (id === playerId ? null : id));
    state.bench = state.bench.map(id => (id === playerId ? null : id));
    showToast(`${getShortName(player)} を負傷離脱中に設定しました`);
  } else {
    showToast(`${getShortName(player)} のけが状態を解除しました`);
  }

  saveState();
  renderAll();
}

function saveSnapshotToHistory() {
  saveState();
  const title = (document.getElementById('match-title')?.value || '予想スタメン').trim() || '予想スタメン';
  const opponent = (document.getElementById('opponent-input')?.value || '').trim();
  const memo = (document.getElementById('match-memo')?.value || '').trim();
  const now = new Date();
  const timeStr = `${now.getMonth() + 1}/${now.getDate()} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

  const item = {
    id: Date.now(),
    savedAt: timeStr,
    matchTitle: title,
    opponent,
    matchMemo: memo,
    formation: state.formation,
    benchSize: state.benchSize,
    startingXI: [...state.startingXI],
    bench: normalizeBenchArray(state.bench, state.benchSize)
  };

  state.history = [item, ...state.history].slice(0, MAX_HISTORY);
  saveHistoryStorage();
  renderHistory();
  showToast('予想履歴に保存しました');
}

function loadHistoryItem(id) {
  const item = state.history.find(h => h.id === id);
  if (!item) return;

  state.matchTitle = item.matchTitle;
  state.opponent = item.opponent || '';
  state.matchMemo = item.matchMemo;
  state.formation = FORMATIONS[item.formation] ? item.formation : '4-4-2';
  state.benchSize = (item.benchSize === 9 || item.benchSize === 12) ? item.benchSize : DEFAULT_BENCH_SIZE;
  state.startingXI = Array.isArray(item.startingXI) ? [...item.startingXI] : [...DEFAULT_XI_IDS];
  state.bench = normalizeBenchArray(item.bench, state.benchSize);

  syncInputsFromState();
  saveState();
  renderAll();
  showToast(`「${item.matchTitle}」を呼び出しました`);
}

function deleteHistoryItem(id) {
  state.history = state.history.filter(h => h.id !== id);
  saveHistoryStorage();
  renderHistory();
  showToast('履歴を削除しました');
}

function renderOpponentUI() {
  const opp = (state.opponent || '').trim();
  const badge = document.getElementById('opponent-display-badge');
  if (badge) {
    if (opp) {
      badge.textContent = `vs ${opp}`;
      badge.classList.remove('hidden');
    } else {
      badge.textContent = '';
      badge.classList.add('hidden');
    }
  }

  const arrow = document.getElementById('j1-arrow');
  if (arrow) arrow.textContent = state.j1Open ? '▲' : '▼';

  document.querySelectorAll('.opp-preset-btn').forEach(btn => {
    const active = opp === btn.textContent.trim();
    btn.className = `opp-preset-btn px-2.5 py-1 rounded-lg text-xs font-bold border transition ${
      active
        ? 'bg-amber-500 text-slate-950 border-amber-300 shadow'
        : 'bg-slate-950 hover:border-slate-500 text-slate-200 border-slate-800'
    }`;
  });

  const j1List = document.getElementById('j1-club-list');
  if (j1List) {
    if (!state.j1Open) {
      j1List.classList.add('hidden');
      j1List.innerHTML = '';
    } else {
      j1List.classList.remove('hidden');
      j1List.innerHTML = J1_OTHER_CLUBS.map(club => {
        const active = opp === club;
        const encoded = encodeURIComponent(club);
        return `
          <button type="button" data-club-encoded="${encoded}" onclick="selectJ1Club(this)"
            class="px-3 py-1.5 rounded-lg text-xs font-bold border text-left transition ${
              active
                ? 'bg-red-700 text-white border-amber-400 shadow'
                : 'bg-slate-950 hover:bg-slate-800 text-slate-200 border-slate-800'
            }">
            ${club}
          </button>
        `;
      }).join('');
    }
  }
}

function selectJ1Club(btn) {
  const encoded = btn?.dataset?.clubEncoded;
  if (!encoded) return;
  const club = decodeURIComponent(encoded);
  setOpponent(club, true);
}

function renderHistory() {
  const container = document.getElementById('history-list');
  if (!container) return;

  if (!state.history || state.history.length === 0) {
    container.innerHTML = '<p class="text-xs text-slate-500">保存された予想はまだありません。「今の予想を保存」から最大3件まで残せます。</p>';
    return;
  }

  container.innerHTML = state.history.map(item => {
    const oppText = item.opponent ? ` · vs ${item.opponent}` : '';
    return `
      <div class="flex items-center justify-between gap-2 p-2.5 rounded-xl bg-slate-950/85 border border-slate-800">
        <button type="button" onclick="loadHistoryItem(${item.id})" class="text-left flex-1 min-w-0">
          <div class="flex items-center gap-1.5">
            <span class="px-1.5 py-0.5 rounded bg-red-800 text-[10px] font-black text-white shrink-0">${item.formation}</span>
            <span class="text-xs font-black text-white truncate">${item.matchTitle}${oppText}</span>
          </div>
          <div class="text-[10px] text-slate-400 mt-0.5 truncate">${item.savedAt}${item.matchMemo ? ' · ' + item.matchMemo : ''}</div>
        </button>
        <div class="flex items-center gap-1.5 shrink-0">
          <button type="button" onclick="loadHistoryItem(${item.id})" class="px-2.5 py-1 rounded-lg text-[11px] font-bold bg-slate-800 hover:bg-slate-700 text-amber-300 border border-slate-700">
            読込
          </button>
          <button type="button" onclick="deleteHistoryItem(${item.id})" class="px-2.5 py-1 rounded-lg text-[11px] font-bold bg-slate-900 hover:bg-rose-950 text-slate-400 hover:text-rose-300 border border-slate-800">
            削除
          </button>
        </div>
      </div>
    `;
  }).join('');
}

function renderFormationButtons() {
  document.querySelectorAll('.form-btn').forEach(btn => {
    const active = btn.dataset.form === state.formation;
    btn.className = `form-btn px-2.5 py-1 rounded-lg text-xs font-black border transition ${
      active
        ? 'bg-red-700 text-white border-amber-400 shadow'
        : 'bg-slate-950 text-slate-300 border-slate-700 hover:border-slate-500'
    }`;
  });
  const badge = document.getElementById('current-form-badge');
  if (badge) badge.textContent = state.formation;
}

function renderBenchSizeButtons() {
  document.querySelectorAll('.bench-size-btn').forEach(btn => {
    const active = Number(btn.dataset.benchSize) === state.benchSize;
    btn.className = `bench-size-btn px-2 py-0.5 rounded-md text-[11px] font-black border transition ${
      active
        ? 'bg-amber-500 text-slate-950 border-amber-300 shadow'
        : 'bg-slate-950 text-slate-300 border-slate-700 hover:border-slate-500'
    }`;
  });
}

function renderPosFilterButtons() {
  document.querySelectorAll('.pos-filter-btn').forEach(btn => {
    const active = btn.dataset.pos === state.posFilter;
    btn.className = `pos-filter-btn px-2.5 py-1 rounded-lg text-xs font-bold border transition ${
      active
        ? 'bg-amber-500 text-slate-950 border-amber-300'
        : 'bg-slate-950 text-slate-300 border-slate-700 hover:border-slate-500'
    }`;
  });
}

function renderPitch() {
  const container = document.getElementById('pitch-slots');
  if (!container) return;
  const coords = FORMATIONS[state.formation] || FORMATIONS['4-4-2'];
  container.innerHTML = '';

  coords.forEach((pos, idx) => {
    const player = state.players.find(p => p.id === state.startingXI[idx]);
    const isSelected = state.selectedSlot.type === 'xi' && state.selectedSlot.index === idx;
    const isGK = pos.role === 'GK';

    const el = document.createElement('button');
    el.type = 'button';
    el.onclick = () => onSlotClick('xi', idx);
    el.style.left = `${pos.x}%`;
    el.style.top = `${pos.y}%`;
    el.className = `slot-btn absolute -translate-x-1/2 -translate-y-1/2 flex flex-col items-center focus:outline-none ${
      isSelected ? 'z-20 scale-105' : 'z-10'
    }`;

    if (player) {
      el.innerHTML = `
        <div class="w-11 h-11 sm:w-12 sm:h-12 rounded-full flex flex-col items-center justify-center border-2 shadow-lg transition ${
          isGK
            ? 'bg-amber-600 border-white text-slate-950'
            : 'antlers-red border-amber-400 text-white'
        } ${isSelected ? 'ring-4 ring-amber-300/85' : ''}">
          <span class="text-[8px] font-black leading-none ${isGK ? 'text-amber-950' : 'text-amber-200'}">${pos.role}</span>
          <span class="font-num text-sm sm:text-base font-black leading-tight">${player.number}</span>
        </div>
        <span class="mt-1 px-2 py-0.5 rounded bg-slate-950/95 border border-amber-400/75 text-[10px] sm:text-[11px] font-black text-white shadow whitespace-nowrap">
          ${getShortName(player)}
        </span>
      `;
    } else {
      el.innerHTML = `
        <div class="w-11 h-11 sm:w-12 sm:h-12 rounded-full flex items-center justify-center bg-slate-950/75 border-2 border-dashed border-white/70 text-[10px] font-black text-white/90 ${
          isSelected ? 'ring-4 ring-amber-300/85 border-amber-300' : ''
        }">
          ${pos.role}
        </div>
        <span class="mt-1 px-1.5 py-0.5 rounded bg-slate-950/80 text-[10px] font-bold text-slate-300">未選択</span>
      `;
    }

    container.appendChild(el);
  });

  const count = state.startingXI.filter(Boolean).length;
  const countEl = document.getElementById('xi-count');
  if (countEl) countEl.textContent = `${count} / 11`;
}

function renderBench() {
  const container = document.getElementById('bench-slots');
  if (!container) return;
  container.innerHTML = '';

  for (let i = 0; i < state.benchSize; i++) {
    const pid = state.bench[i];
    const player = state.players.find(p => p.id === pid);
    const isSelected = state.selectedSlot.type === 'bench' && state.selectedSlot.index === i;

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.onclick = () => onSlotClick('bench', i);
    btn.className = `slot-btn p-2 rounded-xl border text-left flex items-center gap-2 transition ${
      isSelected
        ? 'bg-slate-800 border-amber-400 ring-2 ring-amber-400/50'
        : 'bg-slate-950/80 border-slate-800 hover:border-slate-600'
    }`;

    if (player) {
      btn.innerHTML = `
        <span class="w-6 h-6 rounded-full antlers-red text-white font-num text-xs font-black flex items-center justify-center shrink-0">${player.number}</span>
        <span class="text-xs font-bold text-white truncate">${getShortName(player)}</span>
      `;
    } else {
      btn.innerHTML = `
        <span class="w-6 h-6 rounded-full bg-slate-800 text-slate-500 font-num text-xs font-bold flex items-center justify-center shrink-0">-</span>
        <span class="text-xs font-bold text-slate-500 truncate">空き枠 ${i + 1}</span>
      `;
    }

    container.appendChild(btn);
  }
}

function roundRect(ctx, x, y, w, h, r) {
  const radius = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + radius, y);
  ctx.arcTo(x + w, y, x + w, y + h, radius);
  ctx.arcTo(x + w, y + h, x, y + h, radius);
  ctx.arcTo(x, y + h, x, y, radius);
  ctx.arcTo(x, y, x + w, y, radius);
  ctx.closePath();
}

async function createLineupCanvas() {
  try {
    if (document.fonts && document.fonts.ready) {
      await Promise.race([
        document.fonts.ready,
        new Promise(resolve => setTimeout(resolve, 1200))
      ]);
    }
  } catch (e) {}

  const coords = FORMATIONS[state.formation] || FORMATIONS['4-4-2'];
  const titleText = (document.getElementById('match-title')?.value || '明治安田J1リーグ 予想スタメン').trim();
  const opponentText = (document.getElementById('opponent-input')?.value || '').trim();
  const memoText = (document.getElementById('match-memo')?.value || '').trim();
  const assignedCount = state.startingXI.filter(Boolean).length;

  const scale = 2;
  const width = 480;
  const pitchX = 16;
  const pitchY = 88;
  const pitchW = width - pitchX * 2;
  const pitchH = 528;

  const activeBenchSlots = state.bench.slice(0, state.benchSize);
  const benchRows = Math.max(1, Math.ceil(state.benchSize / 3));
  const benchBoxY = pitchY + pitchH + 14;
  const benchBoxH = 44 + benchRows * 38;

  const footerSpace = 28;
  const totalHeight = benchBoxY + benchBoxH + footerSpace + 12;

  const canvas = document.createElement('canvas');
  canvas.width = width * scale;
  canvas.height = totalHeight * scale;
  const ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);

  ctx.fillStyle = '#0f172a';
  ctx.fillRect(0, 0, width, totalHeight);

  roundRect(ctx, 16, 14, width - 32, 64, 12);
  ctx.fillStyle = '#1e293b';
  ctx.fill();
  ctx.lineWidth = 1;
  ctx.strokeStyle = '#334155';
  ctx.stroke();

  const headerTitle = opponentText ? `${titleText}（vs ${opponentText}）` : titleText;
  ctx.fillStyle = '#ffffff';
  ctx.font = '900 14px "Noto Sans JP", "Inter", sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(headerTitle, 28, 34, width - 125);

  ctx.fillStyle = '#9e0b0f';
  roundRect(ctx, 28, 47, 56, 20, 4);
  ctx.fill();
  ctx.strokeStyle = 'rgba(212, 175, 55, 0.7)';
  ctx.stroke();
  ctx.fillStyle = '#ffffff';
  ctx.font = '800 11px "Inter", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(state.formation, 56, 57);

  ctx.fillStyle = '#fde68a';
  ctx.font = '700 11px "Noto Sans JP", "Inter", sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(memoText, 92, 57, width - 190);

  ctx.fillStyle = '#94a3b8';
  ctx.font = '700 9px "Inter", sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText('STARTING XI', width - 28, 31);
  ctx.fillStyle = '#d4af37';
  ctx.font = '900 14px "Inter", sans-serif';
  ctx.fillText(`${assignedCount} / 11`, width - 28, 52);

  ctx.save();
  roundRect(ctx, pitchX, pitchY, pitchW, pitchH, 12);
  ctx.clip();

  const stripeCount = 10;
  const stripeH = pitchH / stripeCount;
  for (let i = 0; i < stripeCount; i++) {
    ctx.fillStyle = i % 2 === 0 ? '#1b6332' : '#207039';
    ctx.fillRect(pitchX, pitchY + i * stripeH, pitchW, stripeH + 1);
  }

  ctx.strokeStyle = 'rgba(255, 255, 255, 0.72)';
  ctx.lineWidth = 2;
  const pad = 12;
  const innerX = pitchX + pad;
  const innerY = pitchY + pad;
  const innerW = pitchW - pad * 2;
  const innerH = pitchH - pad * 2;

  ctx.strokeRect(innerX, innerY, innerW, innerH);

  const midY = innerY + innerH / 2;
  const midX = innerX + innerW / 2;
  ctx.beginPath();
  ctx.moveTo(innerX, midY);
  ctx.lineTo(innerX + innerW, midY);
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(midX, midY, 52, 0, Math.PI * 2);
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(midX, midY, 3.5, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
  ctx.fill();

  const paW = innerW * 0.54;
  const paH = innerH * 0.155;
  const paX = midX - paW / 2;
  ctx.strokeRect(paX, innerY, paW, paH);

  const gaW = innerW * 0.28;
  const gaH = innerH * 0.058;
  ctx.strokeRect(midX - gaW / 2, innerY, gaW, gaH);

  ctx.strokeRect(paX, innerY + innerH - paH, paW, paH);
  ctx.strokeRect(midX - gaW / 2, innerY + innerH - gaH, gaW, gaH);

  coords.forEach((pos, idx) => {
    const cx = pitchX + (pos.x / 100) * pitchW;
    const cy = pitchY + (pos.y / 100) * pitchH;
    const player = state.players.find(p => p.id === state.startingXI[idx]);
    const isGK = pos.role === 'GK';

    const r = 22;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);

    if (player) {
      ctx.fillStyle = isGK ? '#d97706' : '#9e0b0f';
      ctx.fill();
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = isGK ? '#ffffff' : '#d4af37';
      ctx.stroke();

      ctx.fillStyle = isGK ? '#fffbeb' : '#fde68a';
      ctx.font = '800 8px "Inter", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(pos.role, cx, cy - 8);

      ctx.fillStyle = isGK ? '#0f172a' : '#ffffff';
      ctx.font = '900 16px "Inter", sans-serif';
      ctx.fillText(String(player.number), cx, cy + 5);

      const shortName = getShortName(player);
      ctx.font = '900 11px "Noto Sans JP", "Inter", sans-serif';
      const labelW = Math.max(44, ctx.measureText(shortName).width + 14);
      const labelH = 20;
      const labelX = cx - labelW / 2;
      const labelY = cy + r + 4;

      ctx.fillStyle = 'rgba(15, 23, 42, 0.95)';
      roundRect(ctx, labelX, labelY, labelW, labelH, 5);
      ctx.fill();
      ctx.lineWidth = 1.2;
      ctx.strokeStyle = 'rgba(212, 175, 55, 0.75)';
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.fillText(shortName, cx, labelY + labelH / 2 + 0.5);
    } else {
      ctx.fillStyle = 'rgba(15, 23, 42, 0.72)';
      ctx.fill();
      ctx.setLineDash([4, 3]);
      ctx.lineWidth = 2;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.65)';
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
      ctx.font = '800 10px "Inter", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(pos.role, cx, cy);
    }
  });

  ctx.restore();

  roundRect(ctx, pitchX, pitchY, pitchW, pitchH, 12);
  ctx.lineWidth = 2;
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.75)';
  ctx.stroke();

  roundRect(ctx, 16, benchBoxY, width - 32, benchBoxH, 12);
  ctx.fillStyle = '#111827';
  ctx.fill();
  ctx.lineWidth = 1;
  ctx.strokeStyle = '#334155';
  ctx.stroke();

  ctx.fillStyle = '#9e0b0f';
  ctx.fillRect(28, benchBoxY + 12, 4, 14);
  ctx.fillStyle = '#ffffff';
  ctx.font = '900 12px "Noto Sans JP", "Inter", sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(`ベンチメンバー (SUBS ${state.benchSize}枠)`, 38, benchBoxY + 19);

  const colW = (width - 56 - 12) / 3;
  for (let i = 0; i < state.benchSize; i++) {
    const rIdx = Math.floor(i / 3);
    const cIdx = i % 3;
    const bx = 28 + cIdx * (colW + 6);
    const by = benchBoxY + 36 + rIdx * 38;
    const pid = activeBenchSlots[i];
    const p = state.players.find(item => item.id === pid);

    roundRect(ctx, bx, by, colW, 32, 7);
    ctx.fillStyle = p ? '#1e293b' : 'rgba(15, 23, 42, 0.6)';
    ctx.fill();
    ctx.lineWidth = 1;
    ctx.strokeStyle = p ? '#475569' : '#334155';
    ctx.stroke();

    if (p) {
      ctx.beginPath();
      ctx.arc(bx + 16, by + 16, 10, 0, Math.PI * 2);
      ctx.fillStyle = '#9e0b0f';
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.font = '900 10px "Inter", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(String(p.number), bx + 16, by + 16.5);

      ctx.fillStyle = '#ffffff';
      ctx.font = '800 11px "Noto Sans JP", "Inter", sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(getShortName(p), bx + 31, by + 16.5);
    } else {
      ctx.fillStyle = '#64748b';
      ctx.font = '700 10px "Noto Sans JP", "Inter", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('-', bx + colW / 2, by + 16.5);
    }
  }

  ctx.fillStyle = '#94a3b8';
  ctx.font = '700 10px "Inter", "Noto Sans JP", sans-serif';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  ctx.fillText('Created by @syou0120', width - 18, totalHeight - 14);

  return canvas;
}

function shareToX() {
  saveState();
  const title = (document.getElementById('match-title')?.value || '予想スタメン').trim();
  const opponent = (document.getElementById('opponent-input')?.value || '').trim();
  const memo = (document.getElementById('match-memo')?.value || '').trim();

  const grouped = { GK: [], DF: [], MF: [], FW: [] };
  state.startingXI.forEach(pid => {
    const p = state.players.find(item => item.id === pid);
    if (!p) return;
    const linePos = ['GK', 'DF', 'MF', 'FW'].includes(p.pos) ? p.pos : 'MF';
    grouped[linePos].push(getShortName(p));
  });

  const lineSummary = ['GK', 'DF', 'MF', 'FW']
    .filter(pos => grouped[pos].length > 0)
    .map(pos => `${pos}: ${grouped[pos].join('・')}`);

  const heading = opponent ? `【${title} vs ${opponent}】(${state.formation})` : `【${title}】(${state.formation})`;

  const postText = [
    heading,
    ...lineSummary,
    memo ? `\n${memo}` : '',
    `\nスタメン予想メーカーはこちら👇\n${APP_URL}`,
    `by @syou0120`
  ].filter(Boolean).join('\n');

  const url = `https://x.com/intent/tweet?text=${encodeURIComponent(postText)}`;
  window.open(url, '_blank', 'noopener,noreferrer');
}

async function shareNative() {
  saveState();
  const title = (document.getElementById('match-title')?.value || '予想スタメン').trim();
  const opponent = (document.getElementById('opponent-input')?.value || '').trim();
  const memo = (document.getElementById('match-memo')?.value || '').trim();
  const heading = opponent ? `${title} vs ${opponent}（${state.formation}）` : `${title}（${state.formation}）`;
  const shareText = [
    `${heading}${memo ? ' ' + memo : ''}`,
    `スタメン予想メーカーはこちら👇`,
    APP_URL,
    `by @syou0120`
  ].join('\n');

  showToast('共有用データを準備中...');
  try {
    const canvas = await createLineupCanvas();
    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
    const file = new File([blob], 'kashima_lineup.png', { type: 'image/png' });

    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({
        title: title,
        text: shareText,
        files: [file]
      });
      showToast('共有メニューを開きました');
    } else {
      const dataUrl = canvas.toDataURL('image/png');
      document.getElementById('generated-image-preview').src = dataUrl;
      document.getElementById('download-image-link').href = dataUrl;
      const modal = document.getElementById('share-image-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      showToast('画像を保存してSNSに投稿してください');
    }
  } catch (err) {
    if (err && err.name !== 'AbortError') {
      console.error('共有エラー:', err);
      showToast('共有に失敗しました');
    }
  }
}

async function copyLineupText() {
  saveState();
  const title = (document.getElementById('match-title')?.value || '予想スタメン').trim();
  const opponent = (document.getElementById('opponent-input')?.value || '').trim();
  const memo = (document.getElementById('match-memo')?.value || '').trim();
  const coords = FORMATIONS[state.formation] || FORMATIONS['4-4-2'];

  const xiLines = state.startingXI.map((pid, idx) => {
    const role = coords[idx]?.role || '';
    const p = state.players.find(item => item.id === pid);
    return p ? `${role}: #${p.number} ${p.name}` : `${role}: 未定`;
  });

  const benchNames = state.bench.slice(0, state.benchSize)
    .map(pid => state.players.find(item => item.id === pid))
    .filter(Boolean)
    .map(p => `#${p.number} ${getShortName(p)}`);

  const heading = opponent ? `【${title} vs ${opponent}】(${state.formation})` : `【${title}】(${state.formation})`;

  const text = [
    heading,
    ...xiLines,
    benchNames.length ? `\nSUB: ${benchNames.join(' / ')}` : '',
    memo ? `\n${memo}` : '',
    `Created by @syou0120`
  ].filter(Boolean).join('\n');

  try {
    await navigator.clipboard.writeText(text);
    showToast('スタメンテキストをコピーしました');
  } catch (e) {
    showToast('コピーに失敗しました');
  }
}

let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    el.classList.add('hidden');
  }, 2400);
}

syncInputsFromState();
