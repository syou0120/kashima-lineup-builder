<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹿島アントラーズ スタメン予想メーカー</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Noto+Sans+JP:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'Noto Sans JP', 'Inter', sans-serif;
    background-color: #0b1120;
    color: #f8fafc;
  }
  .font-num {
    font-family: 'Inter', 'Noto Sans JP', sans-serif;
    font-variant-numeric: tabular-nums;
  }
  .soccer-pitch {
    background: repeating-linear-gradient(
      to bottom,
      #1b6332 0px,
      #1b6332 44px,
      #207039 44px,
      #207039 88px
    );
    box-shadow: inset 0 0 36px rgba(0, 0, 0, 0.35);
  }
  .pitch-line {
    border-color: rgba(255, 255, 255, 0.72);
  }
  .antlers-red {
    background: linear-gradient(135deg, #b91c1c 0%, #7f1d1d 100%);
  }
  .antlers-gold-border {
    border-color: #d4af37;
  }
</style>
</head>
<body class="min-h-screen pb-16">

  <!-- ヘッダー -->
  <header class="bg-slate-900/95 border-b border-slate-800 sticky top-0 z-30 backdrop-blur">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-2">
      <div class="flex items-center gap-2.5">
        <span class="w-3 h-7 rounded-sm bg-red-700 border border-amber-400/70 inline-block"></span>
        <div>
          <h1 class="text-base sm:text-lg font-black tracking-tight text-white">鹿島アントラーズ スタメン予想メーカー</h1>
          <p class="text-[11px] text-slate-400">Created by @syou0120</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="resetToDefault()" class="px-3 py-1.5 text-xs font-bold rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition">
          初期スタメンに戻す
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 pt-5 grid grid-cols-1 lg:grid-cols-12 gap-6">

    <!-- 左側：ピッチ＆アクション -->
    <section class="lg:col-span-7 space-y-4">

      <!-- 試合情報＆フォーメーション -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-[11px] font-bold text-slate-400 mb-1">見出し・試合タイトル</label>
            <input id="match-title" type="text" value="明治安田J1リーグ 予想スタメン" oninput="updateMeta()"
              class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-700 text-sm font-bold text-white focus:outline-none focus:border-amber-400">
          </div>
          <div>
            <label class="block text-[11px] font-bold text-slate-400 mb-1">ひとことメモ（任意）</label>
            <input id="match-memo" type="text" value="ホームで勝点3を！" oninput="updateMeta()"
              class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-700 text-sm font-bold text-amber-200 focus:outline-none focus:border-amber-400">
          </div>
        </div>

        <div class="flex flex-wrap items-center justify-between gap-2 pt-1">
          <div class="flex items-center gap-1.5 flex-wrap">
            <span class="text-xs font-bold text
